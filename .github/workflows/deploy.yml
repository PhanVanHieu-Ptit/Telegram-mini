name: Sync to Hugging Face hub
on:
  push:
    branches: [main] # Chạy mỗi khi push vào nhánh main

  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://phanvanhieu:$HF_TOKEN@huggingface.co/spaces/phanvanhieu/3hchat main
